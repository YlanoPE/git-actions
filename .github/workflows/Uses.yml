name: Uses

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Chekout
        run: actions/checkout@v7

      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Show Python version
        run: python --version

      - name: Run Python script
        run: python my_script.py
