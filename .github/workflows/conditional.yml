name: Conditional Example

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose environment"
        required: true
        type: choice
        options:
          - development
          - staging
          - production

jobs:
  conditional-job:
    runs-on: ubuntu-latest

    steps:
      - name: Show selected environment
        run: echo "Selected environment is ${{ github.event.inputs.environment }}"

      - name: Deploy to production
        if: github.event.inputs.environment == 'production'
        run: echo "Deploying to production!"

      - name: Run in test mode
        if: github.event.inputs.environment == 'development' || github.event.inputs.environment == 'staging'
        run: echo "Running in test mode"
